<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gestão de Ativos</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="loginModal" class="modal">
      <div class="modal-card">
        <h2>Acessar o sistema</h2>
        <p>Informe seu e-mail corporativo e sua senha.</p>
        <form id="loginForm">
          <input
            id="loginEmail"
            type="email"
            placeholder="E-mail"
            autocomplete="username"
            required
          />
          <input
            id="loginPassword"
            type="password"
            placeholder="Senha"
            autocomplete="current-password"
            required
          />
          <input id="loginTotp" placeholder="Código 2FA, se solicitado" inputmode="numeric" />
          <button type="submit">Entrar</button>
        </form>
      </div>
    </div>
    <header>
      <div><strong>Gestão de Ativos</strong><span id="actorBadge"></span></div>
    </header>
    <div class="layout">
      <aside>
        <button data-page="dashboard" class="nav active">Dashboard</button
        ><button data-page="employees" class="nav">Funcionários</button
        ><button data-page="assets" class="nav">Ativos</button
        ><button data-page="move" class="nav">Movimentar</button
        ><button data-page="tickets" class="nav">Chamados</button
        ><button data-page="import" class="nav">Importar Excel</button
        ><button data-page="audit" class="nav admin-only hidden">Auditoria</button>
      </aside>
      <main id="app"></main>
    </div>
    <div id="toast"></div>
    <script src="/dashboard.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
