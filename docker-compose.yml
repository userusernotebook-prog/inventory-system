services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN}
      EMPLOYEE_ANONYMIZATION_DAYS: ${EMPLOYEE_ANONYMIZATION_DAYS:-1825}
    volumes:
      - inventory-data:/app/data
    expose:
      - '3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro

  backup:
    build: .
    restart: on-failure
    depends_on:
      app:
        condition: service_healthy
    environment:
      DATABASE_PATH: /app/data/inventory.db
      BACKUP_DIR: /app/data/backups
      BACKUP_EXTERNAL_DIR: /external-backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_MONITOR_URL: ${BACKUP_MONITOR_URL:-}
      AGE_RECIPIENT: ${AGE_RECIPIENT:-}
    volumes:
      - inventory-data:/app/data
      - ${BACKUP_EXTERNAL_HOST_DIR:-./external-backups}:/external-backups
    command: ['node', 'scripts/backup-daemon.js']

volumes:
  inventory-data:
